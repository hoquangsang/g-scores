services:
  web:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://0.0.0.0:${WEB_PORT:-3001} > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - g-scores
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
