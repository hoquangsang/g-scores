name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: develop
        type: string
      run_migration:
        description: Run Prisma migrations before deployment
        required: true
        default: false
        type: boolean
      run_seed:
        description: Run database seed before deployment
        required: true
        default: false
        type: boolean
      run_data_import:
        description: Run score data import before deployment
        required: true
        default: false
        type: boolean
      deploy_api:
        description: Trigger Render API deployment
        required: true
        default: false
        type: boolean
      deploy_web:
        description: Trigger Render Web deployment
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @repo/database build

      - name: Build data import package
        if: ${{ inputs.run_data_import }}
        run: pnpm --filter @repo/data-import build

      - name: Deploy database migrations
        if: ${{ inputs.run_migration }}
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Seed reference data
        if: ${{ inputs.run_seed }}
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Import score data
        if: ${{ inputs.run_data_import }}
        run: pnpm data:import:scores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATA_IMPORT_SCORE_CSV_URL: ${{ vars.DATA_IMPORT_SCORE_CSV_URL }}

      - name: Trigger API deploy
        if: ${{ inputs.deploy_api }}
        run: curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

      - name: Trigger Web deploy
        if: ${{ inputs.deploy_web }}
        run: curl -fsS -X POST "$RENDER_WEB_DEPLOY_HOOK_URL"
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
