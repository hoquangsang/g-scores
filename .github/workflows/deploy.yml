name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - develop
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: develop
        type: string
      run_migration:
        description: Run Prisma migrations before deployment
        required: true
        default: true
        type: boolean
      run_seed:
        description: Run database seed before deployment
        required: true
        default: true
        type: boolean
      deploy_api:
        description: Trigger Render API deployment
        required: true
        default: true
        type: boolean
      deploy_web:
        description: Trigger Render Web deployment
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    env:
      NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build database package
        run: pnpm --filter @repo/database build

      - name: Deploy database migrations
        if: ${{ github.event_name == 'workflow_run' || inputs.run_migration }}
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Seed reference data
        if: ${{ github.event_name == 'workflow_run' || inputs.run_seed }}
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Trigger API deploy
        if: ${{ github.event_name == 'workflow_run' || inputs.deploy_api }}
        run: curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK_URL"
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

      - name: Trigger Web deploy
        if: ${{ github.event_name == 'workflow_run' || inputs.deploy_web }}
        run: curl -fsS -X POST "$RENDER_WEB_DEPLOY_HOOK_URL"
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
