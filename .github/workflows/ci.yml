name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - '!apps/**/*.md'
              - 'packages/**'
              - '!packages/**/*.md'
              - 'tooling/**'
              - '!tooling/**/*.md'
              - 'infrastructure/**'
              - '!infrastructure/**/*.md'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
              - 'commitlint.config.mjs'
              - 'lefthook.yml'
              - '.dockerignore'
              - '.editorconfig'
              - '.prettierignore'
              - '.prettierrc.json'

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  integration:
    name: Integration checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g_scores_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g_scores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Deploy test database schema
        run: pnpm db:test:deploy

      - name: Seed test database
        run: pnpm db:test:seed

      - name: Integration tests
        run: pnpm test:int

      - name: API e2e tests
        run: pnpm --filter @repo/api test:e2e
